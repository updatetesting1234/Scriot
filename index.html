<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Loader v3 | Multi-Engine</title>
    <style>
        /* ... [Insert your previous CSS here] ... */
        #vGame { display:none; flex-direction:column; align-items:center; justify-content:center; background:#000; }
        #canvas { width: 512px; height: 768px; background: #222; border: 4px solid var(--border); box-shadow: 0 0 20px #000; }
        .game-controls { margin-top: 15px; display:flex; gap: 10px; color: var(--text-d); font-size: 10px; }
        kbd { background: #333; padding: 2px 4px; border-radius: 3px; color: var(--accent); }
    </style>
</head>
<body>

<div id="main">
    <div id="content">
        <div class="view" id="vTerminal"></div>
        <div class="view" id="vCode"><pre><code id="codeBlock"></code></pre></div>
        <div class="view" id="vHtml"><iframe id="htmlFrame" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; fullscreen"></iframe></div>
        
        <div class="view" id="vGame">
            <canvas id="canvas"></canvas>
            <div class="game-controls">
                <span>D-PAD: <kbd>ARROWS</kbd></span>
                <span>A/B/X/Y: <kbd>Z</kbd>/<kbd>X</kbd>/<kbd>A</kbd>/<kbd>S</kbd></span>
                <span>START/SELECT: <kbd>ENTER</kbd>/<kbd>SHIFT</kbd></span>
            </div>
            <button class="btn sm danger" onclick="stopEmulator()" style="margin-top:10px">Stop Emulator</button>
        </div>
        
        <div id="dropZone" style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:24px; box-shadow:0 4px 15px rgba(0,0,0,0.5); z-index:100;" onclick="$('fileIn').click()">
            📁
            <input type="file" id="fileIn" style="display:none" onchange="handleFileUpload(this.files[0])">
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════
//  CORE ENGINES
// ══════════════════════════════════════════════

// 1. THE WEB PROXY ENGINE (For PBS Nova, etc.)
async function doLoad(useProxy) {
    let url = $('urlInput').value.trim();
    if (!url) return;

    // Smart fix for common sites
    if (url.includes('github.com/blob')) url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');

    showView('vTerminal');
    tlog(`Initializing Load: ${url}`, 'info');

    try {
        const fetchUrl = useProxy ? `https://api.allorigins.win/get?url=${encodeURIComponent(url)}` : url;
        const res = await fetch(fetchUrl);
        const data = useProxy ? (await res.json()).contents : await res.text();
        
        const type = detectType(url, '', data);
        
        if (type === 'html') {
            renderHtml(data, url);
        } else {
            renderCode(data, type);
        }
        setStatus('ok', 'Load Successful');
    } catch (err) {
        tlog(`Error: ${err.message}`, 'err');
    }
}

function renderHtml(content, originalUrl) {
    showView('vHtml');
    const frame = $('htmlFrame');
    const urlObj = new URL(originalUrl);
    
    // THE COMPATIBILITY TRICK:
    // This <base> tag fixes images and scripts for sites like PBS
    const baseTag = `<base href="${urlObj.protocol}//${urlObj.host}${urlObj.pathname}">`;
    frame.srcdoc = baseTag + content;
}

// 2. THE FILE & GAME ENGINE
async function handleFileUpload(file) {
    if (!file) return;
    tlog(`Processing local file: ${file.name}`, 'info');
    
    const ext = file.name.split('.').pop().toLowerCase();

    if (['nds', 'gb', 'gba'].includes(ext)) {
        startEmulator(file);
    } else {
        // Handle regular files (JS, CSS, HTML)
        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            if (ext === 'html') renderHtml(content, 'file:///local/');
            else renderCode(content, ext);
        };
        reader.readAsText(file);
    }
}

// 3. THE EMULATOR (Concept Logic)
function startEmulator(file) {
    showView('vGame');
    tlog(`Booting Emulator for ${file.name}...`, 'warn');
    
    // To actually run DS games, we would dynamically load a library like:
    // https://cdnjs.cloudflare.com/ajax/libs/desmume/wasm-version.js
    
    tlog("SYSTEM: Emulation layer requires a Wasm core. Please connect a .wasm translation file in 'Settings'.", 'err');
    
    /* In a production environment, you would use:
       const emulator = await EmulatorCore.init({ canvas: $('canvas'), rom: file });
       emulator.run();
    */
}

function stopEmulator() {
    showView('vTerminal');
    tlog("Emulator halted.", "info");
}

// ... [Keep your helper functions: detectType, showView, tlog, setStatus] ...
</script>
</body>
</html>
