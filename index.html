<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #222;
      padding: 10px;
      display: flex;
      gap: 10px;
    }
    input, button {
      padding: 8px;
      border-radius: 5px;
      border: none;
    }
    input { flex-grow: 1; }
    #output {
      flex-grow: 1;
      background: #000;
      color: #0f0;
      padding: 10px;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    #viewer { flex-grow: 1; display: none; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
<header>
  <input id="urlInput" placeholder="Enter URL">
  <button onclick="loadCode()">Load</button>
  <button onclick="proxyMode()">Embed</button>
</header>

<div id="output">Enter a URL and press Load</div>
<div id="viewer">
  <iframe id="codeFrame" sandbox="allow-scripts"></iframe>
</div>

<script>
const PROXY_BASE = "http://YOUR_PC_IP:8080/";

async function loadCode() {
  const url = urlInput.value.trim();
  if (!url) return;

  output.style.display = "block";
  viewer.style.display = "none";

  let html;
  let viaProxy = false;

  try {
    const r = await fetch(url);
    if (!r.ok) throw 0;
    html = await r.text();
  } catch {
    viaProxy = true;
    const r = await fetch(PROXY_BASE + encodeURIComponent(url));
    html = await r.text();
  }

  const doc = new DOMParser().parseFromString(html, "text/html");
  const scripts = [...doc.querySelectorAll("script")];

  if (!scripts.length && !viaProxy) {
    viaProxy = true;
    const r = await fetch(PROXY_BASE + encodeURIComponent(url));
    html = await r.text();
  }

  const parsed = new DOMParser().parseFromString(html, "text/html");
  const finalScripts = [...parsed.querySelectorAll("script")];

  output.textContent =
    `Loaded via: ${viaProxy ? "HTTP SERVER PROXY" : "DIRECT FETCH"}\n\n` +
    (finalScripts.length
      ? finalScripts.map(s => s.textContent).join("\n\n---SCRIPT---\n\n")
      : "No script tags found.");

  codeFrame.srcdoc = html;
  output.style.display = "none";
  viewer.style.display = "block";
}

function proxyMode() {
  const url = urlInput.value.trim();
  if (!url) return;
  viewer.style.display = "block";
  output.style.display = "none";
  codeFrame.removeAttribute("sandbox");
  codeFrame.src = url;
}
</script>
</body>
</html>
