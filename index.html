<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus Code Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --bg: #0a0a0a; --accent: #00ff9d; --text: #e0e0e0; }
    body { margin: 0; font-family: 'Cascadia Code', monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a1a; padding: 12px; display: flex; gap: 10px; border-bottom: 1px solid #333; }
    input { flex: 1; background: #000; border: 1px solid #444; color: var(--accent); padding: 10px; border-radius: 4px; outline: none; }
    button { background: #333; color: white; border: none; padding: 0 15px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
    button:hover { background: var(--accent); color: #000; }
    #output { flex: 1; padding: 15px; overflow-y: auto; white-space: pre-wrap; color: #888; font-size: 13px; }
    #viewer { flex: 1; display: none; background: white; }
    iframe { width: 100%; height: 100%; border: none; }
    .status-tag { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <input id="urlInput" type="text" placeholder="https://example.com/script.js">
  <button onclick="handleLoad(false)">Load</button>
  <button onclick="handleLoad(true)">Proxy (Obfuscated)</button>
</header>

<div id="output">System ready. Awaiting URL input...</div>
<div id="viewer"><iframe id="codeFrame"></iframe></div>

<script>
  const output = document.getElementById("output");
  const viewer = document.getElementById("viewer");
  const frame = document.getElementById("codeFrame");

  async function handleLoad(useProxy) {
    const url = document.getElementById("urlInput").value.trim();
    if (!url) return updateOutput("⚠️ Error: URL required.");

    updateOutput(useProxy ? "🛰️ Initiating Obfuscated Proxy Fetch..." : "🌐 Direct Fetching...");
    
    // The "Proxy" target: Using a public CORS bridge to bypass browser restrictions
    // This replaces your local PC server.
    const targetUrl = useProxy 
      ? `https://api.allorigins.win/get?url=${encodeURIComponent(url)}` 
      : url;

    try {
      const response = await fetch(targetUrl);
      if (!response.ok) throw new Error(`Status ${response.status}`);
      
      let data = await response.json();
      
      // DECODE & DE-OBFUSCATE
      // If using AllOrigins, the content is in data.contents
      let rawContent = useProxy ? data.contents : await response.text();
      
      // Simulate Obfuscation: If you were sending from a custom GitHub Action,
      // you would Base64 encode the string there. We decode it here.
      const processedContent = isBase64(rawContent) ? atob(rawContent) : rawContent;

      renderContent(processedContent);
    } catch (err) {
      updateOutput(`❌ Fail: ${err.message}\nNote: Direct Load often fails due to CORS. Use Proxy.`);
    }
  }

  function renderContent(content) {
    // Extract scripts for the log
    const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
    const scripts = [...content.matchAll(scriptRegex)].map(m => m[1]);
    
    output.style.display = "none";
    viewer.style.display = "block";
    
    // Using srcdoc to safely inject the code into the iframe
    frame.srcdoc = content;
    
    console.log("Extracted Scripts:", scripts);
  }

  function updateOutput(msg) {
    output.style.display = "block";
    viewer.style.display = "none";
    output.textContent = msg;
  }

  function isBase64(str) {
    try { return btoa(atob(str)) == str; } catch (e) { return false; }
  }
</script>
</body>
</html>
